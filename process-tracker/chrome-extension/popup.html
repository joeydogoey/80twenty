<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Process Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      background: #fff;
      color: #1a1a1a;
    }
    .header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid #eee;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #22c55e;
      flex-shrink: 0;
    }
    .status-dot.paused { background: #9ca3af; }
    .status-dot.error { background: #ef4444; }
    .status-text {
      font-weight: 600;
      font-size: 14px;
    }
    .stats {
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      color: #6b7280;
    }
    .stat-value {
      color: #111;
      font-weight: 500;
    }
    .actions {
      padding: 10px 16px 14px;
      border-top: 1px solid #eee;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    button {
      width: 100%;
      padding: 7px 12px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: background 0.15s;
    }
    #toggle-btn {
      background: #f3f4f6;
      color: #374151;
    }
    #toggle-btn:hover { background: #e5e7eb; }
    #toggle-btn.active { background: #fee2e2; color: #b91c1c; }
    .connection-status {
      font-size: 11px;
      color: #9ca3af;
      text-align: center;
      padding-bottom: 2px;
    }
    .connection-status.connected { color: #22c55e; }
    .buffer-warning {
      font-size: 11px;
      color: #d97706;
      padding: 4px 16px;
      background: #fffbeb;
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="status-dot" id="status-dot"></div>
    <span class="status-text" id="status-text">Tracking active</span>
  </div>

  <div class="stats">
    <div class="stat-row">
      <span>Events today</span>
      <span class="stat-value" id="events-today">—</span>
    </div>
    <div class="stat-row">
      <span>Pending upload</span>
      <span class="stat-value" id="buffer-size">—</span>
    </div>
    <div class="stat-row">
      <span>Last upload</span>
      <span class="stat-value" id="last-upload">—</span>
    </div>
  </div>

  <div class="buffer-warning" id="buffer-warning">
    ⚠ Upload backlog — check API settings
  </div>

  <div class="actions">
    <button id="toggle-btn">⏸ Pause Tracking</button>
    <div class="connection-status" id="desktop-connection">
      Desktop agent: not connected
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
