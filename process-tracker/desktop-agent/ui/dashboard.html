<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Process Tracker — Dashboard</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #222636;
      --border: #2e3348;
      --accent: #6366f1;
      --accent2: #22c55e;
      --text: #e2e8f0;
      --text2: #94a3b8;
      --text3: #64748b;
      --red: #ef4444;
      --orange: #f59e0b;
      --click-color: #ef4444;
      --window-color: #6366f1;
      --nav-color: #22c55e;
      --tab-color: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    /* ── Top bar ── */
    .topbar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .topbar h1 {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      margin-right: 8px;
      white-space: nowrap;
    }
    .stat-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 12px;
      color: var(--text2);
      white-space: nowrap;
    }
    .stat-pill strong { color: var(--text); font-weight: 600; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent2); }
    .dot.orange { background: var(--orange); }
    .spacer { flex: 1; }
    .filter-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    select, input[type="date"] {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 5px 10px;
      font-size: 12px;
      outline: none;
      cursor: pointer;
    }
    select:focus, input[type="date"]:focus { border-color: var(--accent); }

    /* ── Main layout ── */
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Left panel: screenshots ── */
    .panel-screenshots {
      width: 320px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
    }
    .panel-header {
      padding: 10px 14px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text3);
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }
    .screenshot-grid {
      overflow-y: auto;
      flex: 1;
      padding: 10px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      align-content: start;
    }
    .screenshot-thumb {
      border-radius: 6px;
      overflow: hidden;
      border: 2px solid transparent;
      cursor: pointer;
      background: var(--surface2);
      transition: border-color 0.15s, transform 0.1s;
      position: relative;
    }
    .screenshot-thumb:hover { border-color: var(--accent); transform: scale(1.02); }
    .screenshot-thumb.active { border-color: var(--accent); }
    .screenshot-thumb img {
      width: 100%;
      display: block;
      aspect-ratio: 16/10;
      object-fit: cover;
    }
    .screenshot-thumb .thumb-meta {
      padding: 5px 7px;
    }
    .thumb-time {
      font-size: 11px;
      font-weight: 600;
      color: var(--text);
    }
    .thumb-app {
      font-size: 10px;
      color: var(--text3);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .trigger-badge {
      position: absolute;
      top: 5px;
      right: 5px;
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 10px;
      letter-spacing: 0.4px;
    }
    .trigger-badge.click     { background: rgba(239,68,68,0.85);  color: #fff; }
    .trigger-badge.window_switch { background: rgba(99,102,241,0.85); color: #fff; }
    .trigger-badge.periodic  { background: rgba(100,116,139,0.85); color: #fff; }
    .no-data {
      padding: 40px 20px;
      text-align: center;
      color: var(--text3);
      font-size: 13px;
      grid-column: 1 / -1;
    }

    /* ── Center panel: screenshot detail ── */
    .panel-detail {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-right: 1px solid var(--border);
    }
    .detail-image-area {
      flex: 1;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #080a10;
      padding: 16px;
      position: relative;
    }
    .detail-image-area img {
      max-width: 100%;
      max-height: 100%;
      border-radius: 6px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.6);
    }
    .detail-placeholder {
      color: var(--text3);
      text-align: center;
    }
    .detail-placeholder .big { font-size: 48px; margin-bottom: 12px; }
    .detail-placeholder p { font-size: 13px; }
    .detail-meta {
      flex-shrink: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 14px 18px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    .meta-item label {
      display: block;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text3);
      margin-bottom: 3px;
    }
    .meta-item .meta-val {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Right panel: events ── */
    .panel-events {
      width: 320px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
    }
    .events-list {
      overflow-y: auto;
      flex: 1;
    }
    .event-item {
      display: flex;
      gap: 10px;
      padding: 9px 14px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.1s;
    }
    .event-item:hover { background: var(--surface2); }
    .event-item.highlight { background: rgba(99,102,241,0.1); border-left: 2px solid var(--accent); }
    .event-type-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 4px;
    }
    .event-type-dot.click          { background: var(--click-color); }
    .event-type-dot.window_change  { background: var(--window-color); }
    .event-type-dot.navigation     { background: var(--nav-color); }
    .event-type-dot.tab_switch     { background: var(--tab-color); }
    .event-type-dot.desktop_click  { background: var(--click-color); }
    .event-type-dot.idle_start,
    .event-type-dot.idle_end       { background: var(--text3); }
    .event-type-dot.session_start,
    .event-type-dot.session_end    { background: var(--accent); }
    .event-body { flex: 1; min-width: 0; }
    .event-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 4px;
    }
    .event-type-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .event-time {
      font-size: 10px;
      color: var(--text3);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .event-desc {
      font-size: 12px;
      color: var(--text);
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .event-sub {
      font-size: 11px;
      color: var(--text3);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-top: 1px;
    }

    /* ── Event detail modal ── */
    .event-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .event-modal-overlay.open { display: flex; }
    .event-modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      width: 500px;
      max-height: 70vh;
      overflow-y: auto;
    }
    .event-modal h3 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 14px;
      color: var(--text);
    }
    .json-view {
      background: var(--bg);
      border-radius: 6px;
      padding: 12px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 11px;
      color: #a8d0ff;
      white-space: pre-wrap;
      word-break: break-all;
      line-height: 1.6;
    }
    .modal-close {
      float: right;
      background: none;
      border: none;
      color: var(--text3);
      font-size: 18px;
      cursor: pointer;
      padding: 0;
      line-height: 1;
    }
    .modal-close:hover { color: var(--text); }

    /* ── Scrollbars ── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text3); }

    /* ── Loading ── */
    .spinner {
      width: 20px; height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 40px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Tab bar ── */
    .tab-bar {
      display: flex;
      gap: 2px;
      padding: 0 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .tab-btn {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text3);
      font-size: 13px;
      font-weight: 500;
      padding: 8px 16px;
      cursor: pointer;
      margin-bottom: -1px;
      transition: color 0.15s, border-color 0.15s;
    }
    .tab-btn:hover { color: var(--text2); }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

    .tab-panel { display: none; flex: 1; overflow: hidden; }
    .tab-panel.active { display: flex; }

    /* ── Summary tab ── */
    .summary-panel {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .summary-section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--text3);
      margin-bottom: 12px;
    }

    /* Time-per-app bar chart */
    .app-bar-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .app-bar-row {
      display: grid;
      grid-template-columns: 160px 1fr 80px;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }
    .app-bar-row:hover .app-bar-fill { opacity: 0.85; }
    .app-bar-name {
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .app-bar-track {
      background: var(--surface2);
      border-radius: 4px;
      height: 10px;
      overflow: hidden;
    }
    .app-bar-fill {
      height: 100%;
      border-radius: 4px;
      background: var(--accent);
      transition: width 0.4s ease;
    }
    .app-bar-time {
      font-size: 11px;
      color: var(--text2);
      text-align: right;
      white-space: nowrap;
    }

    /* Workflow sequence cards */
    .workflow-cards {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .workflow-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
    }
    .workflow-card-header {
      font-size: 11px;
      color: var(--text3);
      margin-bottom: 8px;
    }
    .workflow-chain {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .workflow-app-chip {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 11px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .workflow-app-chip .chip-time {
      color: var(--text3);
      font-size: 10px;
    }
    .workflow-arrow {
      color: var(--text3);
      font-size: 11px;
    }

    /* App switch feed */
    .switch-feed {
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .switch-row {
      display: flex;
      gap: 10px;
      padding: 7px 0;
      border-bottom: 1px solid var(--border);
      align-items: baseline;
    }
    .switch-time {
      font-size: 10px;
      color: var(--text3);
      width: 64px;
      flex-shrink: 0;
    }
    .switch-transition {
      font-size: 12px;
      color: var(--text);
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .switch-duration {
      font-size: 11px;
      color: var(--accent2);
      flex-shrink: 0;
      white-space: nowrap;
    }
    .switch-from { color: var(--text3); }
    .switch-arrow { color: var(--text3); margin: 0 4px; }
    .no-summary {
      color: var(--text3);
      text-align: center;
      padding: 40px;
      font-size: 13px;
    }
  </style>
</head>
<body>

<!-- Top bar -->
<div class="topbar">
  <h1>🔍 Process Tracker</h1>
  <div class="stat-pill"><div class="dot"></div> <span>Events today: <strong id="stat-events">—</strong></span></div>
  <div class="stat-pill"><div class="dot orange"></div> <span>Screenshots: <strong id="stat-screenshots">—</strong></span></div>
  <div class="stat-pill" id="stat-session-pill"><span>Session: <strong id="stat-session">—</strong></span></div>
  <div class="spacer"></div>
  <div class="filter-row">
    <input type="date" id="filter-date" title="Filter by date" />
    <select id="filter-app"><option value="">All apps</option></select>
    <select id="filter-type">
      <option value="">All events</option>
      <option value="click">Click</option>
      <option value="desktop_click">Desktop click</option>
      <option value="window_change">Window change</option>
      <option value="navigation">Navigation</option>
      <option value="tab_switch">Tab switch</option>
    </select>
  </div>
</div>

<!-- Tab bar -->
<div class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('timeline')">Timeline</button>
  <button class="tab-btn" onclick="switchTab('summary')">Activity Summary</button>
</div>

<!-- Main layout -->
<div class="tab-panel active" id="tab-timeline">
<div class="main" style="flex:1;overflow:hidden;display:flex">

  <!-- Left: screenshot grid -->
  <div class="panel-screenshots">
    <div class="panel-header">Screenshots <span id="screenshot-count" style="font-weight:400;text-transform:none;letter-spacing:0"></span></div>
    <div class="screenshot-grid" id="screenshot-grid">
      <div class="spinner" style="grid-column:1/-1;margin:30px auto"></div>
    </div>
  </div>

  <!-- Center: screenshot detail -->
  <div class="panel-detail">
    <div class="detail-image-area" id="detail-image-area">
      <div class="detail-placeholder">
        <div class="big">📸</div>
        <p>Select a screenshot to view it</p>
      </div>
    </div>
    <div class="detail-meta" id="detail-meta" style="display:none">
      <div class="meta-item"><label>Time</label><div class="meta-val" id="dm-time">—</div></div>
      <div class="meta-item"><label>App</label><div class="meta-val" id="dm-app">—</div></div>
      <div class="meta-item"><label>Trigger</label><div class="meta-val" id="dm-trigger">—</div></div>
      <div class="meta-item"><label>Window</label><div class="meta-val" id="dm-window">—</div></div>
      <div class="meta-item"><label>Click position</label><div class="meta-val" id="dm-click">—</div></div>
      <div class="meta-item"><label>File size</label><div class="meta-val" id="dm-size">—</div></div>
      <div class="meta-item"><label>Uploaded</label><div class="meta-val" id="dm-uploaded">—</div></div>
      <div class="meta-item"><label>ID</label><div class="meta-val" id="dm-id" style="font-size:10px;font-family:monospace">—</div></div>
    </div>
  </div>

  <!-- Right: event stream -->
  <div class="panel-events">
    <div class="panel-header">Events <span id="event-count" style="font-weight:400;text-transform:none;letter-spacing:0"></span></div>
    <div class="events-list" id="events-list">
      <div class="spinner"></div>
    </div>
  </div>

</div>
</div><!-- /tab-timeline -->

<!-- Summary tab -->
<div class="tab-panel" id="tab-summary" style="flex-direction:column">
  <div class="summary-panel" id="summary-panel">
    <div class="spinner" style="margin:60px auto"></div>
  </div>
</div>

<!-- Event detail modal -->
<div class="event-modal-overlay" id="event-modal-overlay" onclick="closeModal(event)">
  <div class="event-modal">
    <button class="modal-close" onclick="document.getElementById('event-modal-overlay').classList.remove('open')">×</button>
    <h3 id="modal-title">Event Detail</h3>
    <div class="json-view" id="modal-json"></div>
  </div>
</div>

<script src="dashboard.js"></script>
</body>
</html>
